version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/presentations/cloud-native-2.0"
      - "/presentations/cloud-native-2.0/demo/set_url"
      - "/presentations/lets-meet-cdktf-python"
    schedule:

# Standalone checks. No deployment credentials, production environment or live API calls.
name: Rawkode Tools MCP
on:
  pull_request:
    paths:
      - .github/workflows/rawkode-tools-mcp-checks.yml
      - projects/rawkode.tools/mcp/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rawkode-tools-mcp-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rawkode.tools/mcp
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Nix runtime
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: accept-flake-config = true
      - name: Synchronize repository environment
        working-directory: .
        run: |
          curl -fsSL https://github.com/cuenv/cuenv/releases/download/0.78.0/cuenv-linux-x64 -o /tmp/cuenv
          echo '4f582623e67a12fab3814e2ec72d053e5fc17ee105a1071d016a9fdf9bfe31b3  /tmp/cuenv' | sha256sum --check --status
          chmod +x /tmp/cuenv
          /tmp/cuenv sync -A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the flake
        run: nix flake check --no-build
      # Both run inside the flake's dev shell through cuenv's Nix runtime.
      - run: /tmp/cuenv task check
      - run: /tmp/cuenv task test
      - name: Owner script compiles with the flake's Python and google-auth-oauthlib
        run: /tmp/cuenv exec -- python -I -c "import google_auth_oauthlib, py_compile; py_compile.compile('scripts/owner.py', doraise=True)"

# Alerts when YouTube analytics stops reaching the analytics lake: opens a
# GitHub issue (or comments on the open one) when the day's sync or the initial
# backfill failed, and closes it once a sync completes. A second issue opens
# when the lake's per-video views stay below YouTube's public counts after the
# daily heal backfill (the sync's reconciliation), and closes when they agree. Hand-written because
# cuenv pipelines have no schedule trigger. Reads only the Worker's public
# /status endpoint: workflow states and error messages, no data or secrets.
name: youtube-analytics-monitor
on:
  schedule:
    # Two and a half hours after the 08:17 UTC sync starts.
    - cron: "47 10 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: youtube-analytics-monitor
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the latest sync and the initial backfill
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS_URL: https://rawkode-academy-youtube-analytics.rawkodeacademy.workers.dev/status
        run: |
          set -uo pipefail
          title="YouTube analytics sync is failing"
          consent="Run \`cuenv task consent\` in \`projects/rawkode.academy/platform/youtube-control\`: it renews the Google grant in Infisical and redeploys."
          problem=""
          if ! status=$(curl -fsS --max-time 30 "$STATUS_URL"); then
            problem="The Worker's status endpoint didn't answer ($STATUS_URL). Check the latest run of the rawkode-academy-platform-youtube-control-default workflow."
          else
            sync=$(jq -r '.sync.status // "missing"' <<<"$status")
            sync_error=$(jq -r '.sync.error // ""' <<<"$status")
            backfill=$(jq -r '.backfill.status // "missing"' <<<"$status")
            backfill_error=$(jq -r '.backfill.error // ""' <<<"$status")
            if [ "$sync" != "complete" ]; then
              problem="Today's sync is \`$sync\`${sync_error:+: $sync_error}"
            elif [ "$backfill" = "errored" ] || [ "$backfill" = "terminated" ]; then
              problem="The initial backfill is \`$backfill\`${backfill_error:+: $backfill_error}. Restart it with \`cuenv task backfill -e production\`."
            fi
            if grep -q "reauthorization_required" <<<"$sync_error$backfill_error"; then
              problem="$problem"$'\n\n'"**Google no longer accepts the stored authorization.** $consent"
            fi
          fi
          report() {
            # $1 title, $2 problem ("" when healthy), $3 closing comment
            local existing
            existing=$(gh issue list --state open --search "in:title \"$1\"" --json number,title --jq ".[] | select(.title == \"$1\") | .number" | head -n 1)
            if [ -z "$2" ]; then
              if [ -n "$existing" ]; then gh issue close "$existing" --comment "$3"; fi
              return 0
            fi
            local body="$2"$'\n\n'"Status: $STATUS_URL"$'\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$1" --body "$body"; fi
            echo "::error::$2"
          }
          report "$title" "$problem" "Today's sync completed."
          failed=0
          [ -n "$problem" ] && failed=1

          # The sync's reconciliation: only when the sync itself completed.
          drift=""
          if [ -n "${status:-}" ] && [ "${sync:-}" = "complete" ]; then
            rec_error=$(jq -r '.sync.reconcile.error // ""' <<<"$status")
            persistent=$(jq -r '.sync.reconcile.persistentCount // 0' <<<"$status")
            if [ -n "$rec_error" ]; then
              drift="The daily reconciliation against YouTube could not run: $rec_error"
            elif [ "$persistent" -gt 0 ]; then
              list=$(jq -r '.sync.reconcile.persistent[] | "- https://www.youtube.com/watch?v=\(.videoId): lake \(.lake), YouTube \(.youtube)"' <<<"$status")
              drift="$persistent video(s) were already below YouTube's public view count yesterday, and a heal backfill ran since. The lake still undercounts them (worst first, at most 20 listed):"$'\n\n'"$list"$'\n\n'"Check the heal run: \`youtube-analytics-backfill\` instances \`heal-<date>\`."
            fi
            report "YouTube analytics drifts from YouTube's own counts" "$drift" "The lake agrees with YouTube's public view counts again."
            [ -n "$drift" ] && failed=1
          fi
          exit $failed

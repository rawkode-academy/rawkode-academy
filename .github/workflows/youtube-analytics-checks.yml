# Standalone checks. No deployment credentials, production environment or live API calls.
name: YouTube analytics
on:
  pull_request:
    paths:
      - .github/workflows/youtube-analytics-checks.yml
      - .github/workflows/youtube-analytics-monitor.yml
      - projects/rawkode.academy/platform/youtube-control/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-analytics-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rawkode.academy/platform/youtube-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/rawkode.academy/platform/youtube-control/package-lock.json
      - name: Install repository Nix runtime
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: accept-flake-config = true
      - name: Synchronize repository environment
        working-directory: .
        run: |
          curl -fsSL https://github.com/cuenv/cuenv/releases/download/0.78.0/cuenv-linux-x64 -o /tmp/cuenv
          echo '4f582623e67a12fab3814e2ec72d053e5fc17ee105a1071d016a9fdf9bfe31b3  /tmp/cuenv' | sha256sum --check --status
          chmod +x /tmp/cuenv
          /tmp/cuenv sync -A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npm run check --workspaces=false
      - run: npm test --workspaces=false
      - run: python3 -m py_compile scripts/consent.py && bash -n scripts/backfill.sh

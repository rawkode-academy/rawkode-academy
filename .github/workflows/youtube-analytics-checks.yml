# Standalone checks. No deployment credentials, production environment or live API calls.
name: YouTube analytics
on:
  pull_request:
    paths:
      - .github/workflows/youtube-analytics-checks.yml
      - .github/workflows/youtube-analytics-monitor.yml
      - projects/rawkode.academy/platform/youtube-control/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-analytics-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rawkode.academy/platform/youtube-control
    steps:
      - uses: actions/checkout@v4
      - name: Install repository Nix runtime
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: accept-flake-config = true
      - name: Synchronize repository environment
        working-directory: .
        run: |
          curl -fsSL https://github.com/cuenv/cuenv/releases/download/0.81.2/cuenv-linux-x64 -o /tmp/cuenv
          echo '63366dbd762fc4d3585f6a9988effa54780ef255d0e05dd5fcdf0bbc0a64cd68  /tmp/cuenv' | sha256sum --check --status
          chmod +x /tmp/cuenv
          /tmp/cuenv sync -A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the flake
        run: nix flake check --no-build
      # Both run inside the flake's dev shell through cuenv's Nix runtime.
      - run: /tmp/cuenv task check
      - run: /tmp/cuenv task test
      - name: Consent script compiles with the flake's Python and google-auth-oauthlib
        run: /tmp/cuenv exec -- python -I -c "import google_auth_oauthlib, py_compile; py_compile.compile('scripts/consent.py', doraise=True)" && bash -n scripts/backfill.sh && bash -n scripts/verify.sh

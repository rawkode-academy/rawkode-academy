name: rawkode-academy-website-pullRequest
on:
  pull_request:
    paths:
    - .github/workflows/rawkode-academy-website-pullrequest.yml
    - bun.lock
    - bun.lock/**
    - cue.mod/**
    - packages/design-system/**
    - packages/live-viewer/**
    - packages/rich-text/**
    - projects/rawkode.academy/games/secrets-of-kubernetes/achievements/**
    - projects/rawkode.academy/games/secrets-of-kubernetes/leaderboard/**
    - projects/rawkode.academy/games/secrets-of-kubernetes/player-learned-phrases/**
    - projects/rawkode.academy/games/secrets-of-kubernetes/player-stats/**
    - projects/rawkode.academy/games/secrets-of-kubernetes/share-cards/**
    - projects/rawkode.academy/platform/email-preferences/**
    - projects/rawkode.academy/platform/notifications/**
    - projects/rawkode.academy/website/astro.config.mts
    - projects/rawkode.academy/website/astro.config.mts/**
    - projects/rawkode.academy/website/env.cue
    - projects/rawkode.academy/website/env.cue/**
    - projects/rawkode.academy/website/package.json
    - projects/rawkode.academy/website/package.json/**
    - projects/rawkode.academy/website/public/**
    - projects/rawkode.academy/website/schema/**
    - projects/rawkode.academy/website/scripts/**
    - projects/rawkode.academy/website/src/**
    - projects/rawkode.academy/website/vitest.config.ts
    - projects/rawkode.academy/website/vitest.config.ts/**
    - projects/rawkode.academy/website/wrangler.jsonc
    - projects/rawkode.academy/website/wrangler.jsonc/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  rawkode-academy-website-pullRequest:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: write
      id-token: write
    name: rawkode-academy-website-pullRequest
    environment: production
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Determinate receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Prune Determinate Nix receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.70.1"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Get GitHub OIDC token for Infisical
      run: |-
        set -eu
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::No GitHub Actions OIDC token endpoint: the job needs 'id-token: write' and must run on GitHub Actions" >&2
          exit 1
        fi
        if [ -z "${INFISICAL_MACHINE_IDENTITY_ID:-}" ]; then
          echo "::error::INFISICAL_MACHINE_IDENTITY_ID is empty: add the repository secret or set #identityId on #InfisicalOidc" >&2
          exit 1
        fi
        request_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
        audience=''
        if [ -n "$audience" ]; then
          request_url="${request_url}&audience=$(jq -rn --arg value "$audience" '$value|@uri')"
        fi
        jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url" | jq -r '.value // empty')"
        if [ -z "$jwt" ]; then
          echo "::error::GitHub Actions returned no OIDC token" >&2
          exit 1
        fi
        # A line break in a value would let it set other variables (and break
        # ::add-mask::), so refuse it without printing the value.
        has_line_break() { [ "$(printf '%s' "$1" | tr -d '\r\n')" != "$1" ]; }
        if has_line_break "$INFISICAL_MACHINE_IDENTITY_ID"; then
          echo "::error::INFISICAL_MACHINE_IDENTITY_ID contains a line break; check the secret or #identityId" >&2
          exit 1
        fi
        if has_line_break "$jwt"; then
          echo "::error::GitHub Actions returned an OIDC token containing a line break" >&2
          exit 1
        fi
        echo "::add-mask::${jwt}"
        echo "::add-mask::${INFISICAL_MACHINE_IDENTITY_ID}"
        delimiter="ghadelimiter_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'INFISICAL_AUTH_JWT<<%s\n%s\n%s\n' "$delimiter" "$jwt" "$delimiter"
          printf 'INFISICAL_MACHINE_IDENTITY_ID<<%s\n%s\n%s\n' "$delimiter" "$INFISICAL_MACHINE_IDENTITY_ID" "$delimiter"
        } >> "$GITHUB_ENV"
      env:
        INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: Setup 1Password
      run: cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Setup Infisical
      run: cuenv exec -- cuenv secrets setup infisical
      env:
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_ORGANIZATION_SLUG: ${{ secrets.INFISICAL_ORGANIZATION_SLUG }}
        INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
    - name: 'Run pipeline: pullRequest'
      run: cuenv ci --pipeline pullRequest --path projects/rawkode.academy/website
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: production
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_ORGANIZATION_SLUG: ${{ secrets.INFISICAL_ORGANIZATION_SLUG }}
        INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}

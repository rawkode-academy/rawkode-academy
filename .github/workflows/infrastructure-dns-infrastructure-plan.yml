# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: infrastructure-dns-infrastructure-plan
on:
  pull_request:
    paths:
    - .github/workflows/infrastructure-dns-infrastructure-plan.yml
    - cue.mod/**
    - env.cue
    - infrastructure/dns/**
    - infrastructure/dns/env.cue
    - infrastructure/dns/schema/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure-dns-infrastructure-plan:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    name: infrastructure-dns-infrastructure-plan
    runs-on: namespace-profile-linux-x86
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Cache /nix on Namespace volume
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        cache: nix
    - name: Prepare Determinate receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: accept-flake-config = true
    - name: Prune Determinate Nix receipt
      run: |-
        if [ -e /nix/receipt.json ]; then
          if command -v sudo >/dev/null 2>&1; then
            sudo rm -f /nix/receipt.json
          else
            rm -f /nix/receipt.json
          fi
        fi
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.60.1"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: Setup 1Password
      run: cuenv secrets setup onepassword
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Plan infrastructure
      id: plan
      run: |-
        set -o pipefail
        status=0
        cuenv infrastructure plan --path infrastructure/dns 2>&1 | tee "${{ runner.temp }}/cuenv-infrastructure-plan.txt" || status=$?
        {
          printf '### Infrastructure plan: `infrastructure-dns`\n\n````diff\n'
          cat "${{ runner.temp }}/cuenv-infrastructure-plan.txt"
          printf '````\n'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    - name: Comment infrastructure plan
      if: '!cancelled() && steps.plan.outcome != ''skipped'' && github.event.pull_request.head.repo.full_name == github.repository'
      uses: actions/github-script@v7
      with:
        script: |-
          const fs = require('fs');
          const marker = '<!-- cuenv-infrastructure-plan:infrastructure-dns -->';
          const file = process.env.PLAN_FILE;
          let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trimEnd() : '';
          if (plan === '') plan = 'The plan produced no output.';
          const limit = 60000;
          if (plan.length > limit) plan = `${plan.slice(0, limit)}\n… (truncated; the job log has the full plan)`;
          const failed = process.env.PLAN_OUTCOME !== 'success';
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = [
            marker,
            `### ${failed ? '❌ Infrastructure plan failed' : 'Infrastructure plan'}: \`infrastructure-dns\``,
            '',
            '````diff',
            plan,
            '````',
            '',
            `[Workflow run](${run}) · ${context.sha.slice(0, 7)}`,
          ].join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find((comment) =>
            comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
      env:
        PLAN_FILE: ${{ runner.temp }}/cuenv-infrastructure-plan.txt
        PLAN_OUTCOME: ${{ steps.plan.outcome }}

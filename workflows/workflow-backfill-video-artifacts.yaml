id: a6c293e8-f7a7-49ac-8835-30dc474904c3
name: backfill-video-artifacts
description: >-
  Find published videos that lack captions or a thumbnail in the content
  bucket, start the jobs that produce them, and confirm the
  artifacts are served.
version: 1
tags: {}
vaults:
  - rawkode-academy
  - default
inputs:
  properties:
    videos:
      type: string
      default: ""
      description: Comma-separated video ids to consider; empty considers every published video
    kinds:
      type: string
      default: ""
      description: >-
        Comma-separated artifact kinds to backfill (`captions`, `thumbnail`);
        empty backfills both
    maximum:
      type: integer
      default: 0
      description: Most jobs to start, newest videos first; 0 starts one for every missing artifact
    waitMinutes:
      type: number
      default: 30
      description: How long to wait for the triggered artifacts to be served before failing
jobs:
  - name: backfill
    description: Discover, trigger and verify
    steps:
      - name: discover
        description: List published videos and plan a job for every missing artifact
        task:
          type: behavior
          behavior: video-artifacts
          methodName: discover
          inputs:
            videos: ${{ inputs.videos }}
            kinds: ${{ inputs.kinds }}
            maximum: ${{ inputs.maximum }}
      - name: trigger
        description: Start one Cloudflare Workflow instance per missing artifact
        dependsOn:
          - step: discover
            condition:
              type: succeeded
        guard: ${{ size(data.latest("video-artifacts", "plan").attributes.jobs) == 0 }}
        task:
          type: behavior
          behavior: video-artifacts
          methodName: trigger
          inputs:
            apiToken: ${{ vault.get(rawkode-academy, cloudflare/api-tokens/workers) }}
      - name: verify
        description: Fail unless every planned artifact is now served
        dependsOn:
          - step: trigger
            condition:
              type: succeeded
        guard: ${{ size(data.latest("video-artifacts", "plan").attributes.jobs) == 0 }}
        task:
          type: behavior
          behavior: video-artifacts
          methodName: verify
          inputs:
            waitMinutes: ${{ inputs.waitMinutes }}

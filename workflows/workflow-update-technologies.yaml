id: cb02e6c2-c244-411c-bb61-3403e6e85c50
name: update-technologies
description: >-
  Audit technology profiles in the platform-technologies D1 database against
  primary sources, then write the confirmed corrections after approval.
version: 1
tags: {}
vaults:
  - rawkode-academy
  - default
inputs:
  properties:
    technologies:
      type: string
      default: ""
      description: Comma-separated technology ids to audit; empty audits every profile
    accept:
      type: string
      default: ""
      description: >-
        Comma-separated findings whose observed value should be written, as
        `field` or `id:field` (for example `argo:documentation,license`)
    changes:
      type: object
      default: {}
      description: >-
        Values to write regardless of the findings: technology id, then field
        path, then value (null clears), for example
        {"kubernetes": {"community.blog": "https://kubernetes.io/blog/"}}
jobs:
  - name: update
    description: Read, audit, draft, plan, approve, write, confirm and invalidate
    steps:
      - name: read
        description: Read the requested technology rows from D1
        task:
          type: behavior
          behavior: technologies-database
          methodName: d1_query_database
          inputs:
            database_id: 4671b796-cdc8-4a4e-aa58-4e10eb24b67d
            body:
              sql: >-
                SELECT *, (SELECT json_group_array(id) FROM technologies) AS known_ids
                FROM technologies
                WHERE ?1 = '' OR instr(',' || replace(?1, ' ', '') || ',', ',' || id || ',') > 0
                ORDER BY id
              params:
                - ${{ inputs.technologies }}
      - name: audit
        description: Check every field against primary sources and search-result standards
        dependsOn:
          - step: read
            condition:
              type: succeeded
        task:
          type: behavior
          behavior: technology-profiles
          methodName: audit
          inputs:
            rows: ${{ data.latest("technologies-database", "d1_query_database-current").attributes[0].results }}
            technologies: ${{ inputs.technologies }}
            changes: ${{ inputs.changes }}
      - name: draft
        description: Draft the search-result title and description of every profile that lacks a good one
        dependsOn:
          - step: audit
            condition:
              type: succeeded
        guard: ${{ size(data.latest("technology-profiles", "seo-requests").attributes.requests) == 0 }}
        task:
          type: behavior
          behavior: seo-writer
          methodName: cli_generate_many
          inputs:
            batch: technology-seo
            systemPrompt: ${{ data.latest("technology-profiles", "seo-requests").attributes.systemPrompt }}
            requests: ${{ data.latest("technology-profiles", "seo-requests").attributes.requests }}
      - name: plan
        description: Plan the update from the audit, the checked drafts and the inputs
        dependsOn:
          - step: draft
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: behavior
          behavior: technology-profiles
          methodName: plan
          inputs:
            rows: ${{ data.latest("technologies-database", "d1_query_database-current").attributes[0].results }}
            accept: ${{ inputs.accept }}
            changes: ${{ inputs.changes }}
            drafts: ${{ data.findBySpec("seo-writer", "cliResult") }}
      - name: approve
        description: Review the plan before anything is written
        dependsOn:
          - step: plan
            condition:
              type: succeeded
        guard: ${{ size(data.latest("technology-profiles", "plan").attributes.statements) == 0 }}
        task:
          type: manual_approval
          prompt: >-
            Review the planned technology updates before they are written to
            production D1: swamp data query 'modelName == "technology-profiles"
            && name == "plan"' --select attributes.summary
          timeout: 86400
      - name: write
        description: Apply the planned updates to D1 in one batch
        dependsOn:
          - step: approve
            condition:
              type: succeeded
        guard: ${{ size(data.latest("technology-profiles", "plan").attributes.statements) == 0 }}
        task:
          type: behavior
          behavior: technologies-database
          methodName: d1_query_database
          inputs:
            database_id: 4671b796-cdc8-4a4e-aa58-4e10eb24b67d
            body:
              batch: ${{ data.latest("technology-profiles", "plan").attributes.statements }}
      - name: reread
        description: Read the rows back from D1
        dependsOn:
          - step: write
            condition:
              type: succeeded
        guard: ${{ size(data.latest("technology-profiles", "plan").attributes.statements) == 0 }}
        task:
          type: behavior
          behavior: technologies-database
          methodName: d1_query_database
          inputs:
            database_id: 4671b796-cdc8-4a4e-aa58-4e10eb24b67d
            body:
              sql: >-
                SELECT * FROM technologies
                WHERE ?1 = '' OR instr(',' || replace(?1, ' ', '') || ',', ',' || id || ',') > 0
                ORDER BY id
              params:
                - ${{ inputs.technologies }}
      - name: confirm
        description: Fail unless every planned value is now stored
        dependsOn:
          - step: reread
            condition:
              type: succeeded
        guard: ${{ size(data.latest("technology-profiles", "plan").attributes.statements) == 0 }}
        task:
          type: behavior
          behavior: technology-profiles
          methodName: confirm
          inputs:
            rows: ${{ data.latest("technologies-database", "d1_query_database-current").attributes[0].results }}
      - name: invalidate
        description: Purge the website cache for the updated technologies
        dependsOn:
          - step: confirm
            condition:
              type: succeeded
        guard: ${{ size(data.latest("technology-profiles", "plan").attributes.statements) == 0 }}
        task:
          type: behavior
          behavior: technology-profiles
          methodName: invalidate
          inputs:
            token: ${{ vault.get(rawkode-academy, website-cache-invalidation) }}
